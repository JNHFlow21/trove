name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: bash scripts/bootstrap_runtime.sh
      - run: ./scripts/trove-python scripts/check.py release
