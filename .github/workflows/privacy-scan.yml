name: privacy-scan

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  privacy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Bootstrap project Python runtime
        env:
          TROVE_RUNTIME_INSTALL_EXTRAS: ""
        run: bash scripts/bootstrap_runtime.sh
      - run: ./scripts/trove-python scripts/privacy_scan.py .
